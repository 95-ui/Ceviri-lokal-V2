name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python & Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install Pillow --break-system-packages || pip3 install Pillow

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - name: Go to project folder & Install Dependencies
        run: |
          cd ceviri-lokal-v2
          npm install

      - name: Create Icons
        run: |
          cd ceviri-lokal-v2
          python3 make_icons.py

      - name: Expo Prebuild (mit Fix)
        run: |
          cd ceviri-lokal-v2
          npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_PACKAGE_NAME: de.ceviri.lokal

      - name: Create Bundle
        run: |
          cd ceviri-lokal-v2
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build APK
        run: |
          cd ceviri-lokal-v2/android
          chmod +x gradlew
          ./gradlew assembleDebug --max-workers 2 --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ceviri-lokal-apk
          path: ceviri-lokal-v2/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
