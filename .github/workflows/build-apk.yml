name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Python & Pillow
        run: pip3 install Pillow --break-system-packages

      - name: Install Dependencies
        run: |
          cd ceviri-lokal-v2
          npm install

      - name: Create Icons
        run: |
          cd ceviri-lokal-v2
          python3 make_icons.py

      - name: Expo Prebuild
        run: |
          cd ceviri-lokal-v2
          npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Fix Gradle wrapper version
        run: |
          cd ceviri-lokal-v2/android
          sed -i 's|gradle-.*-all.zip|gradle-8.0.2-all.zip|g' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Create JS Bundle
        run: |
          cd ceviri-lokal-v2
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build APK
        run: |
          cd ceviri-lokal-v2/android
          chmod +x gradlew
          ./gradlew assembleDebug --max-workers 2
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ceviri-lokal-apk
          path: ceviri-lokal-v2/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
